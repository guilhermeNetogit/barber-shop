<form #form="ngForm" (ngSubmit)="onSubmit(form)" class="container form-card">
  <div class="row">
    <div class="col-12">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Nome</mat-label>
        <input matInput name="name" id="name" #nameModel="ngModel" [(ngModel)]="client.name" required>
        @if (nameModel.hasError('required')){
        <mat-error>Informe o nome do cliente</mat-error>
        }
      </mat-form-field>
    </div>
  </div>

  <div class="row">
    <div class="col-6">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>E-mail</mat-label>
        <input matInput name="email" id="email" #emailModel="ngModel" [(ngModel)]="client.email" required email>
        @if (emailModel.hasError('required') || emailModel.hasError('email')){
        <mat-error>Informe um e-mail válido</mat-error>
        }
      </mat-form-field>
    </div>
    <div class="col-6">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Celular</mat-label>
        <input matInput name="phone" id="phone" #phoneModel="ngModel" [(ngModel)]="client.phone" required
          mask="(00) 00000-0000" [validation]="true">
        @if (phoneModel.hasError('required') || phoneModel.hasError('mask')){
        <mat-error>Informe um celular válido</mat-error>
        }
      </mat-form-field>
    </div>
  </div>

  <!-- Ações com botões estilizados -->
  <div class="row mt-4">
    <div class="col d-flex justify-content-end align-items-center">
      <button type="button" mat-stroked-button color="warn" class="btn-custom btn-cancelar" (click)="onCancel()">
        <mat-icon>cancel</mat-icon>
        Cancelar
      </button>
      <button type="submit" mat-flat-button color="primary" class="btn-custom" [disabled]="form.invalid">
        <mat-icon>save</mat-icon>
        Salvar
      </button>
    </div>
  </div>
</form>
